          with zipfile.ZipFile(wheel) as archive:
              entries = [
                  name for name in archive.namelist()
                  if PurePosixPath(name).name.casefold() == "_windows_runtime_manifest.json"
              ]
              if len(entries) != 1 or archive.read(entries[0]) != exported_manifest:
                  raise SystemExit("wheel/exported Windows runtime manifests differ")
              package_dir = PurePosixPath(entries[0]).parent
              for runtime in manifest["runtimes"]:
                  member = str(package_dir / runtime["member"])
                  payload = archive.read(member)
                  digest = hashlib.sha256(payload).hexdigest()
                  if digest != runtime["member_sha256"]:
                      raise SystemExit(f"wheel runtime hash mismatch: {member}")
                  provider = Path("dl/windows-python-provider-runtimes") / runtime["member"]
                  if hashlib.sha256(provider.read_bytes()).hexdigest() != digest:
                      raise SystemExit(f"provider/runtime bytes differ: {runtime['member']}")
                  (output / runtime["member"]).write_bytes(payload)
          PY

          one_file() {
            local pattern="$1"; shift
            local matches=("$@"/$pattern)
            test "${#matches[@]}" -eq 1 || {
              echo "ERROR: expected one match for $*/$pattern; found ${#matches[@]}" >&2
              exit 1
            }
            printf '%s\n' "${matches[0]}"
          }
          WINPY_PACKAGED="$INPUTS/windows-python-packaged"
          WINPY_PROVIDER="dl/windows-python-provider-runtimes"
          WINPY_LIBGCC="$(one_file 'libgcc_s_*.dll' "$WINPY_PACKAGED")"
          WINPY_LIBSTDCXX="$(one_file 'libstdc++-*.dll' "$WINPY_PACKAGED")"
          WINPY_LIBGOMP="$(one_file 'libgomp-*.dll' "$WINPY_PACKAGED")"
          WINPY_LIBWINPTHREAD="$(one_file 'libwinpthread-*.dll' "$WINPY_PACKAGED")"
          WINPY_LIBDL="$(one_file 'libdl.dll' "$WINPY_PACKAGED")"
          STATA_LIBGOMP="$(one_file 'libgomp-*.dll' dl/windows-stata-runtime)"
          STATA_LIBWINPTHREAD="$(one_file 'libwinpthread-*.dll' dl/windows-stata-runtime)"
          MANY_PACKAGED="$(one_file '*' dl/linux-wheel-packaged-runtime)"
          MANY_PROVIDER="$(one_file '*' dl/linux-wheel-provider-runtime)"
          MANY_SRPM="$(one_file '*.src.rpm' dl/corresponding-source)"

          metadata_value() {
            python3 - "$1" "$2" <<'PY'
          import json, sys
          value = json.loads(open(sys.argv[1], encoding="utf-8").read())
          for part in sys.argv[2].split("."):
              value = value[int(part)] if isinstance(value, list) else value[part]
          print(value)
          PY
          }
          MANY_NEVRA="$(metadata_value dl/linux-wheel-runtime-ledger.json repaired_wheel.private_libraries.0.provider_rpm.nevra)"
          MANY_SRPM_NAME="$(metadata_value dl/linux-wheel-runtime-ledger.json repaired_wheel.private_libraries.0.provider_rpm.source_rpm)"
          MANY_PROVIDER_PATH="$(metadata_value dl/linux-wheel-runtime-ledger.json repaired_wheel.private_libraries.0.provider_source_path)"
          test "$(basename "$MANY_SRPM")" = "$MANY_SRPM_NAME"

          WINPY_MANIFEST=dl/windows-python-provider-runtimes/_windows_runtime_manifest.json
          runtime_source_path() {
            python3 - "$WINPY_MANIFEST" "$1" <<'PY'
          import json, sys
          ledger = json.loads(open(sys.argv[1], encoding="utf-8").read())
          matches = [item["source_path"] for item in ledger["runtimes"] if item["member"].casefold() == sys.argv[2].casefold()]
          if len(matches) != 1:
              raise SystemExit(f"expected one runtime member {sys.argv[2]!r}; found {len(matches)}")
          print(matches[0])
          PY
          }
          stata_runtime_source_path() {
            python3 - dl/windows-stata-runtime-ledger.json "$1" <<'PY'
          import json, sys
          ledger = json.loads(open(sys.argv[1], encoding="utf-8").read())
          matches = [item["source_path"] for item in ledger["runtimes"] if item["member"].casefold() == sys.argv[2].casefold()]
          if len(matches) != 1:
              raise SystemExit(f"expected one Stata runtime member {sys.argv[2]!r}; found {len(matches)}")
          print(matches[0])
          PY
          }

          mkdir -p release_assets
          python3 tools/build_corresponding_source_bundle.py \
            --output "release_assets/xhdfe-${EXPECTED_VERSION}-corresponding-source.zip" \
            --version "$EXPECTED_VERSION" \
            --contains-cuda \
            --license-dir "$INPUTS/licenses" \
            --component "gcc=$INPUTS/components/gcc-13.2.0.tar.xz" \
            --component "mingw-w64=$INPUTS/components/mingw-w64_11.0.1.orig.tar.bz2" \
            --component "dlfcn-win32=$INPUTS/components/dlfcn-win32-v1.4.1.tar.gz" \
            --component "winlibs-recipes=$INPUTS/components/winlibs-recipes-b209c11.tar.gz" \
            --component "winlibs-tools=$INPUTS/components/winlibs-tools-0ad30ed.tar.gz" \
            --provider-source "ubuntu-mingw-gcc=$INPUTS/providers/ubuntu-mingw-gcc" \
            --provider-source "ubuntu-mingw-w64=$INPUTS/providers/ubuntu-mingw-w64" \
            --provider-source "manylinux-libgomp=dl/corresponding-source" \
            --runtime-binary "windows-python-libgcc=$WINPY_LIBGCC" \
            --runtime-provider windows-python-libgcc=gcc \
            --provider-binary "windows-python-libgcc=$WINPY_PROVIDER/$(basename "$WINPY_LIBGCC")" \
            --runtime-binary "windows-python-libstdcxx=$WINPY_LIBSTDCXX" \
            --runtime-provider windows-python-libstdcxx=gcc \
            --provider-binary "windows-python-libstdcxx=$WINPY_PROVIDER/$(basename "$WINPY_LIBSTDCXX")" \
            --runtime-binary "windows-python-libgomp=$WINPY_LIBGOMP" \
            --runtime-provider windows-python-libgomp=gcc \
            --provider-binary "windows-python-libgomp=$WINPY_PROVIDER/$(basename "$WINPY_LIBGOMP")" \
            --runtime-binary "windows-python-libwinpthread=$WINPY_LIBWINPTHREAD" \
            --runtime-provider windows-python-libwinpthread=mingw-w64 \
            --provider-binary "windows-python-libwinpthread=$WINPY_PROVIDER/$(basename "$WINPY_LIBWINPTHREAD")" \
            --runtime-binary "windows-python-libdl=$WINPY_LIBDL" \
            --runtime-provider windows-python-libdl=dlfcn-win32 \
            --provider-binary "windows-python-libdl=$WINPY_PROVIDER/$(basename "$WINPY_LIBDL")" \
            --runtime-binary "windows-stata-libgomp=$STATA_LIBGOMP" \
            --runtime-provider windows-stata-libgomp=ubuntu-mingw-gcc \
            --provider-binary "windows-stata-libgomp=$STATA_LIBGOMP" \
            --runtime-binary "windows-stata-libwinpthread=$STATA_LIBWINPTHREAD" \
            --runtime-provider windows-stata-libwinpthread=ubuntu-mingw-w64 \
            --provider-binary "windows-stata-libwinpthread=$STATA_LIBWINPTHREAD" \
            --runtime-binary "manylinux-wheel-libgomp=$MANY_PACKAGED" \
            --runtime-provider manylinux-wheel-libgomp=manylinux-libgomp \
            --provider-binary "manylinux-wheel-libgomp=$MANY_PROVIDER" \
            --metadata gcc.version=13.2.0 \
            --metadata gcc.upstream_url=https://gcc.gnu.org/pub/gcc/releases/gcc-13.2.0/ \
            --metadata mingw-w64.version=11.0.1 \
            --metadata mingw-w64.upstream_url=https://launchpad.net/ubuntu/noble/+source/mingw-w64/11.0.1-3build1 \
            --metadata dlfcn-win32.version=1.4.1 \
            --metadata dlfcn-win32.upstream_url=https://github.com/dlfcn-win32/dlfcn-win32/tree/v1.4.1 \
            --metadata winlibs-recipes.commit=b209c11b4b4bed71816d52d5cc4682bfcd05b41f \
            --metadata winlibs-recipes.upstream_url=https://github.com/brechtsanders/winlibs_recipes/commit/b209c11b4b4bed71816d52d5cc4682bfcd05b41f \
            --metadata winlibs-tools.commit=0ad30ed8b99071629e63e4c3f5531ec0e5abbc0a \
            --metadata winlibs-tools.upstream_url=https://github.com/brechtsanders/winlibs_tools/commit/0ad30ed8b99071629e63e4c3f5531ec0e5abbc0a \
            --metadata ubuntu-mingw-gcc.source_package=gcc-mingw-w64 \
            --metadata ubuntu-mingw-gcc.source_version=26.1+gcc-13_13.2.0-6ubuntu1 \
            --metadata ubuntu-mingw-gcc.upstream_url=https://launchpad.net/ubuntu/noble/+source/gcc-mingw-w64/26.1 \
            --metadata ubuntu-mingw-w64.source_package=mingw-w64 \
            --metadata ubuntu-mingw-w64.source_version=11.0.1-3build1 \
            --metadata ubuntu-mingw-w64.upstream_url=https://launchpad.net/ubuntu/noble/+source/mingw-w64/11.0.1-3build1 \
            --metadata "manylinux-libgomp.nevra=$MANY_NEVRA" \
            --metadata "manylinux-libgomp.sourcerpm=$MANY_SRPM_NAME" \
            --metadata "manylinux-libgomp.provider_path=$MANY_PROVIDER_PATH" \
            --metadata manylinux-libgomp.upstream_url=https://git.centos.org/rpms/gcc-toolset-13-gcc \
            --metadata "windows-python-libgcc.release_path=wheel/xhdfe/$(basename "$WINPY_LIBGCC")" \
            --metadata "windows-python-libgcc.provider_path=$(runtime_source_path "$(basename "$WINPY_LIBGCC")")" \
            --metadata "windows-python-libstdcxx.release_path=wheel/xhdfe/$(basename "$WINPY_LIBSTDCXX")" \
            --metadata "windows-python-libstdcxx.provider_path=$(runtime_source_path "$(basename "$WINPY_LIBSTDCXX")")" \
            --metadata "windows-python-libgomp.release_path=wheel/xhdfe/$(basename "$WINPY_LIBGOMP")" \
            --metadata "windows-python-libgomp.provider_path=$(runtime_source_path "$(basename "$WINPY_LIBGOMP")")" \
            --metadata "windows-python-libwinpthread.release_path=wheel/xhdfe/$(basename "$WINPY_LIBWINPTHREAD")" \
            --metadata "windows-python-libwinpthread.provider_path=$(runtime_source_path "$(basename "$WINPY_LIBWINPTHREAD")")" \
            --metadata "windows-python-libdl.release_path=wheel/xhdfe/$(basename "$WINPY_LIBDL")" \
            --metadata "windows-python-libdl.provider_path=$(runtime_source_path "$(basename "$WINPY_LIBDL")")" \
            --metadata windows-stata-libgomp.release_path=xhdfe_xfe-stata-windows-cpu.zip/libgomp-1.dll \
            --metadata "windows-stata-libgomp.provider_path=$(stata_runtime_source_path "$(basename "$STATA_LIBGOMP")")" \
            --metadata windows-stata-libwinpthread.release_path=xhdfe_xfe-stata-windows-cpu.zip/libwinpthread-1.dll \
            --metadata "windows-stata-libwinpthread.provider_path=$(stata_runtime_source_path "$(basename "$STATA_LIBWINPTHREAD")")" \
            --metadata "manylinux-wheel-libgomp.release_path=$(metadata_value dl/linux-wheel-runtime-ledger.json repaired_wheel.private_libraries.0.member)" \
            --metadata "manylinux-wheel-libgomp.provider_path=$MANY_PROVIDER_PATH"
          python3 tools/validate_corresponding_source_bundle.py \
            "release_assets/xhdfe-${EXPECTED_VERSION}-corresponding-source.zip"

      - name: Assemble per-platform Stata bundles + release assets
        run: |
          set -euo pipefail
          mkdir -p release_assets
          NVIDIA_LICENSE_DIR="$RUNNER_TEMP/xhdfe-corresponding-inputs/licenses"
          test -f "$NVIDIA_LICENSE_DIR/NVIDIA-CUDA-12.6-EULA.pdf"
          test -f "$NVIDIA_LICENSE_DIR/NVIDIA-CCCL-2.5.0-LICENSE"

          # Shared, platform-independent Stata package files.
          SHARED=(
            stata/LICENSE stata/NOTICE
            stata/xhdfe.ado stata/xhdfe.sthlp stata/xhdfe.pkg
            stata/xhdfe_p.ado stata/xhdfe_estat.ado
            stata/xhdfeakm.ado stata/xhdfeakm.sthlp
            stata/xhdfeconnected.ado stata/xhdfeconnected.sthlp
            stata/xhdfegelbach.ado stata/xhdfegelbach.sthlp
            stata/xhdfegelbachbootstrap.ado stata/xhdfegelbachbootstrap.sthlp
            stata/xhdfegelbachetable.ado stata/xhdfegelbachetable.sthlp
            stata/xhdfegelbachcoefplot.ado stata/xhdfegelbachcoefplot.sthlp
            stata/xhdfegpu.ado stata/xhdfegpu.sthlp
            stata/xfe.ado stata/xfe.sthlp stata/xfe.pkg
            stata/stata.toc
          )
          LICENSE_MATERIALS=(
            third_party/licenses/GCC-13.2.0-COPYING3
            third_party/licenses/GCC-13.2.0-COPYING.RUNTIME
            third_party/licenses/mingw-w64-11.0.1-winpthreads-COPYING
            third_party/licenses/dlfcn-win32-1.4.1-COPYING
            third_party/eigen-3.4.0/COPYING.APACHE
            third_party/eigen-3.4.0/COPYING.BSD
            third_party/eigen-3.4.0/COPYING.GPL
            third_party/eigen-3.4.0/COPYING.LGPL
            third_party/eigen-3.4.0/COPYING.MINPACK
            third_party/eigen-3.4.0/COPYING.MPL2
            third_party/eigen-3.4.0/COPYING.README
          )
          for s in "${SHARED[@]}" "${LICENSE_MATERIALS[@]}"; do
            test -f "$s" || { echo "MISSING shared Stata file: $s" >&2; exit 1; }
          done

          # bundle <zipname> <xhdfe-plugin-src> <xfe-plugin-src>
          # Stages the platform plugins under canonical names + the shared files,
          # then zips. The canonical names (xhdfe.plugin / xfe.plugin) are what
          # Stata loads at runtime.
          bundle() {
            local zipname="$1" xhdfe_src="$2" xfe_src="$3"
            shift 3
            test -f "$xhdfe_src" || { echo "MISSING plugin src: $xhdfe_src" >&2; exit 1; }
            test -f "$xfe_src"   || { echo "MISSING plugin src: $xfe_src"   >&2; exit 1; }
            local stage; stage="$(mktemp -d)"
            cp "$xhdfe_src" "$stage/xhdfe.plugin"
            cp "$xfe_src"   "$stage/xfe.plugin"
            local s
            for s in "${SHARED[@]}"; do cp "$s" "$stage/"; done
            for s in "${LICENSE_MATERIALS[@]}"; do
              if [[ "$s" == third_party/eigen-3.4.0/* ]]; then
                cp "$s" "$stage/Eigen-3.4.0-$(basename "$s")"
              else
                cp "$s" "$stage/"
              fi
            done
            for s in "$@"; do
              test -f "$s" || { echo "MISSING runtime dependency: $s" >&2; exit 1; }
              cp "$s" "$stage/"
            done
            if [[ "$zipname" == "xhdfe_xfe-stata-linux-cuda.zip" ]]; then
              mkdir -p "$stage/artifacts"
              cp -R dl/cuda-license-files "$stage/artifacts/"
              python3 - dl/linux-cuda-provenance.json "$stage" <<'PY'
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import sys

          ledger = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          stage = Path(sys.argv[2])
          records = ledger.get("licenses")
          if not isinstance(records, list) or len(records) < 2:
              raise SystemExit("CUDA provenance has no complete license ledger")
          expected = set()
          for record in records:
              relative = record.get("artifact_path")
              pure = PurePosixPath(relative) if isinstance(relative, str) else None
              if (
                  pure is None
                  or pure.is_absolute()
                  or ".." in pure.parts
                  or pure.parts[:2] != ("artifacts", "cuda-license-files")
              ):
                  raise SystemExit(f"unsafe CUDA license artifact path: {relative!r}")
              target = stage.joinpath(*pure.parts)
              if not target.is_file() or target.is_symlink():
                  raise SystemExit(f"missing CUDA license artifact: {relative}")
              payload = target.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              if (
                  digest != record.get("artifact_sha256")
                  or digest != record.get("sha256")
              ):
                  raise SystemExit(f"CUDA license hash mismatch: {relative}")
              expected.add(target.resolve())
          actual = {
              path.resolve()
              for path in (stage / "artifacts" / "cuda-license-files").iterdir()
              if path.is_file() and not path.is_symlink()
          }
          if actual != expected:
              raise SystemExit("CUDA license directory differs from provenance ledger")
          PY
            fi
            if [[ "$zipname" == "xhdfe_xfe-stata-windows-cpu.zip" ]]; then
              python3 - "$stage" <<'PY'
          import json
          from pathlib import Path
          import sys

          stage = Path(sys.argv[1])
          provider = json.loads(
              (stage / "windows-stata-provider-ledger.json").read_text(encoding="utf-8")
          )
          runtime_names = [entry["name"] for entry in provider["entries"]]
          additions = runtime_names + [
              "windows-stata-provider-ledger.json",
              "windows-stata-runtime-ledger.json",
              "GCC-13.2.0-COPYING3",
              "GCC-13.2.0-COPYING.RUNTIME",
              "mingw-w64-11.0.1-winpthreads-COPYING",
              "dlfcn-win32-1.4.1-COPYING",
              "Eigen-3.4.0-COPYING.APACHE",
              "Eigen-3.4.0-COPYING.BSD",
              "Eigen-3.4.0-COPYING.GPL",
              "Eigen-3.4.0-COPYING.LGPL",
              "Eigen-3.4.0-COPYING.MINPACK",
              "Eigen-3.4.0-COPYING.MPL2",
              "Eigen-3.4.0-COPYING.README",
          ]
          for name in additions:
              if not (stage / name).is_file():
                  raise SystemExit(f"Windows ZIP package input is missing: {name}")
          for pkg_name in ("xhdfe.pkg", "xfe.pkg"):
              pkg = stage / pkg_name
              lines = pkg.read_text(encoding="utf-8").splitlines()
              existing = {line[2:] for line in lines if line.startswith("f ")}
              lines.extend(f"f {name}" for name in additions if name not in existing)
              pkg.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
              bash tools/validate_stata_package_site.sh "$stage"
            fi
            ( cd "$stage" && zip -q -r -X "$GITHUB_WORKSPACE/release_assets/$zipname" . )
            rm -rf "$stage"
            echo "built release_assets/$zipname"
            unzip -l "release_assets/$zipname"
          }

          bundle xhdfe_xfe-stata-linux-cpu.zip       dl/xhdfe.plugin.linux-cpu  dl/xfe.plugin.linux-cpu
          bundle xhdfe_xfe-stata-linux-cuda.zip \
            dl/xhdfe.plugin.linux-cuda dl/xfe.plugin.linux-cuda \
            "$NVIDIA_LICENSE_DIR/NVIDIA-CUDA-12.6-EULA.pdf" \
            "$NVIDIA_LICENSE_DIR/NVIDIA-CCCL-2.5.0-LICENSE" \
            dl/linux-cuda-provenance.json \
            dl/cuda-nvcc-invocations.jsonl \
            dl/cuda-nvcc-link-dryrun.log
          bundle xhdfe_xfe-stata-macos-universal.zip dl/xhdfe.plugin.macos      dl/xfe.plugin.macos
          WINDOWS_RUNTIME_FILES=(dl/windows-stata-runtime/*.dll)
          test "${#WINDOWS_RUNTIME_FILES[@]}" -ge 2
          bundle xhdfe_xfe-stata-windows-cpu.zip \
            dl/xhdfe.plugin.windows dl/xfe.plugin.windows \
            "${WINDOWS_RUNTIME_FILES[@]}" \
            dl/windows-stata-runtime-ledger.json \
            dl/windows-stata-provider-ledger.json

          cp dl/xhdfe-*.whl dl/xhdfe-*.tar.gz dl/xhdfe_*.tar.gz release_assets/

          # Source-only archive used by xhdfegpu and offline local builds.
          # The builder performs its own closure and pinned-Rcpp validation.
          bash tools/make_source_dist_zip.sh \
            "$GITHUB_WORKSPACE/release_assets/xhdfe-src.zip"

          # ---- Autonomous offline source + multi-platform runtime bundle ----
          # Build from the exact tagged tree; never select a historical dist/*.zip.
          # The archive contains every tracked source/build input (including vendored
          # Eigen, pybind11, Rcpp, and stplugin inputs) plus the exact CI Linux,
          # Windows, and macOS plugins. CI itself proves compile/link only. Publication remains
          # blocked until those exact CUDA bytes are downloaded from this run and
          # exercised on the maintainer H100; only then is a publish-v* marker pushed.
          OFFLINE_NAME="xhdfe_xfe-offline-source-and-platform-binaries.zip"
          OFFLINE_STAGE="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$OFFLINE_STAGE"
          mkdir -p "$OFFLINE_STAGE/prebuilt/linux_x86_64"
          cp dl/xhdfe.plugin.linux-cpu \
            "$OFFLINE_STAGE/prebuilt/linux_x86_64/xhdfe_cpu.plugin"
          cp dl/xfe.plugin.linux-cpu \
            "$OFFLINE_STAGE/prebuilt/linux_x86_64/xfe_cpu.plugin"
          cp dl/xhdfe.plugin.linux-cuda \
            "$OFFLINE_STAGE/prebuilt/linux_x86_64/xhdfe_cuda_fatbin.plugin"
          cp dl/xfe.plugin.linux-cuda \
            "$OFFLINE_STAGE/prebuilt/linux_x86_64/xfe_cuda_fatbin.plugin"
          mkdir -p "$OFFLINE_STAGE/prebuilt/windows_x86_64"
          cp dl/xhdfe.plugin.windows \
            "$OFFLINE_STAGE/prebuilt/windows_x86_64/xhdfe.plugin"
          cp dl/xfe.plugin.windows \
            "$OFFLINE_STAGE/prebuilt/windows_x86_64/xfe.plugin"
          cp dl/windows-stata-runtime/*.dll \
            "$OFFLINE_STAGE/prebuilt/windows_x86_64/"
          cp dl/windows-stata-runtime-ledger.json \
            dl/windows-stata-provider-ledger.json \
            "$OFFLINE_STAGE/prebuilt/windows_x86_64/"
          mkdir -p "$OFFLINE_STAGE/prebuilt/macos_universal"
          cp dl/xhdfe.plugin.macos \
            "$OFFLINE_STAGE/prebuilt/macos_universal/xhdfe.plugin"
          cp dl/xfe.plugin.macos \
            "$OFFLINE_STAGE/prebuilt/macos_universal/xfe.plugin"
          mkdir -p "$OFFLINE_STAGE/packages/python" "$OFFLINE_STAGE/packages/R"
          cp dl/xhdfe-*.whl dl/xhdfe-*.tar.gz \
            "$OFFLINE_STAGE/packages/python/"
          cp dl/xhdfe_*.tar.gz "$OFFLINE_STAGE/packages/R/"
          mkdir -p "$OFFLINE_STAGE/provenance"
          cp dl/linux-cuda-provenance.json \
            dl/cuda-nvcc-invocations.jsonl \
            dl/cuda-nvcc-link-dryrun.log \
            dl/linux-wheel-runtime-ledger.json \
            "$OFFLINE_STAGE/provenance/"
          cp -R dl/cuda-license-files "$OFFLINE_STAGE/provenance/"
          cp release_assets/xhdfe-*-corresponding-source.zip \
            "$OFFLINE_STAGE/"
          cp "$NVIDIA_LICENSE_DIR/NVIDIA-CUDA-12.6-EULA.pdf" \
            "$NVIDIA_LICENSE_DIR/NVIDIA-CCCL-2.5.0-LICENSE" \
            "$OFFLINE_STAGE/third_party/licenses/"
          cp dl/xhdfe.plugin.linux-cpu "$OFFLINE_STAGE/stata/xhdfe.plugin"
          cp dl/xfe.plugin.linux-cpu "$OFFLINE_STAGE/stata/xfe.plugin"
          cat > "$OFFLINE_STAGE/OFFLINE_ARTIFACT_SCOPE.md" <<'EOF'
          # Offline artifact scope

          This archive is generated from the exact tagged Git tree and contains
          the installable Stata package, C++/CUDA/Python/R/Stata sources, build
          scripts, package metadata, validation programs, and vendored third-party
          inputs required by the documented offline build paths. It also contains
          the release Python wheel/source distribution and R source package.

          `stata/xhdfe.plugin` and `stata/xfe.plugin` are portable Linux CPU/OpenMP
          defaults. `prebuilt/` also contains the exact Linux CUDA fatbins,
          Windows x86_64 OpenMP plugins and runtime DLLs, and macOS universal
          plugins from the release workflow. The root-level corresponding-source
          ZIP closes the GNU/MinGW runtime source mappings, while the NVIDIA
          CUDA 12.6 EULA and CCCL 2.5.0 notices accompany the CUDA fatbins.

          GitHub-hosted CI has no Stata licence or GPU and therefore certifies only
          compilation, linking, binary format, OpenMP linkage, and embedded CUDA
          architectures. The release remains a draft until the exact CUDA plugins
          from this workflow have been executed successfully on the maintainer H100.
          The `publish-v*` marker records completion of that external runtime gate.
          EOF
          (
            cd "$OFFLINE_STAGE"
            find . -type f ! -name MANIFEST.sha256 -print0 |
              sort -z |
              xargs -0 sha256sum > MANIFEST.sha256
            sha256sum -c MANIFEST.sha256
            zip -q -r -X "$GITHUB_WORKSPACE/release_assets/$OFFLINE_NAME" .
          )
          rm -rf "$OFFLINE_STAGE"
          echo "built release_assets/$OFFLINE_NAME"

          # ---- Online Stata net-install site ----
          # This is the unpacked site published to the gh-pages branch.  The
          # generated .pkg files use Stata platform-specific g lines, so one URL
          # can serve Linux, macOS, and Windows when the corresponding plugin
          # artifacts are present.
          bash tools/stage_stata_netinstall_site.sh "$GITHUB_WORKSPACE/netinstall_site/stata" \
            --linux-xhdfe dl/xhdfe.plugin.linux-cpu \
            --linux-xfe   dl/xfe.plugin.linux-cpu \
            --macos-xhdfe dl/xhdfe.plugin.macos \
            --macos-xfe   dl/xfe.plugin.macos \
            --windows-xhdfe dl/xhdfe.plugin.windows \
            --windows-xfe   dl/xfe.plugin.windows \
            --windows-runtime-dir dl/windows-stata-runtime \
            --windows-runtime-provider-ledger dl/windows-stata-provider-ledger.json \
            --windows-runtime-closure-ledger dl/windows-stata-runtime-ledger.json
          cp release_assets/xhdfe-src.zip netinstall_site/stata/xhdfe-src.zip
          bash tools/validate_stata_package_site.sh \
            "$GITHUB_WORKSPACE/netinstall_site/stata"
          ( cd "$GITHUB_WORKSPACE/netinstall_site" && zip -q -r -X "$GITHUB_WORKSPACE/release_assets/xhdfe_xfe-stata-netinstall-site.zip" . )
          echo "built release_assets/xhdfe_xfe-stata-netinstall-site.zip"

          (
            cd release_assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          echo "== final release assets =="
          ls -la release_assets

      - name: Write release notes body
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(python3 -c 'import re;s=open("xhdfe/_version.py").read();print(re.search(r"__version__\s*=\s*\"([^\"]+)\"",s).group(1))')"
          RELEASE_NOTES="docs/releases/RELEASE_NOTES_${EXPECTED_VERSION}.md"
          test -f "$RELEASE_NOTES" || {
            echo "ERROR: missing tagged release notes: $RELEASE_NOTES" >&2
            exit 1
          }
          cp "$RELEASE_NOTES" release_body.md
          cat >> release_body.md <<EOF

          ---

          ## Release assets and installation

          Stata plugins built automatically on GitHub-hosted runners.

          > GitHub-hosted CI imports and exercises the Python wheels and runs
          > \`R CMD check\`. For the Stata plugins it proves **COMPILE + LINK only**:
          > the runners have **no Stata license**, and they have **no GPU** for CUDA
          > runtime validation. The workflow initially stages this release as a
          > draft and permits publication only after the exact plugins contained in
          > the attached Linux CUDA bundle pass
          > Stata CPU/CUDA functional validation on real hardware (an NVIDIA H100,
          > \`sm_90\`). A published release therefore records completion of that
          > external gate.

          ## Online Stata install

          The \`publish-v*\` gate publishes the exact H100-certified snapshot to
          \`gh-pages\`. Stata can install the OS-appropriate plugin from one URL:

          \`\`\`stata
          net install xhdfe, from("https://raw.githubusercontent.com/reisportela/xhdfe-xfe/gh-pages/stata") replace
          net install xfe,   from("https://raw.githubusercontent.com/reisportela/xhdfe-xfe/gh-pages/stata") replace
          \`\`\`

          The online \`.pkg\` files use Stata's platform-specific \`g\` lines:
          Linux installs the portable CPU/OpenMP plugin, macOS installs the
          universal CPU plugin, and Windows installs the Windows plugin when that
          build artifact exists.

          ## Assets

          ### Per-platform Stata bundles (plugin renamed to canonical \`xhdfe.plugin\` / \`xfe.plugin\` + shared ado/sthlp/pkg/stata.toc)
          - \`xhdfe_xfe-stata-linux-cpu.zip\` — **Linux x86_64, CPU/OpenMP** (portable ELF, links libgomp; no \`-march=native\`).
          - \`xhdfe_xfe-stata-linux-cuda.zip\` — **Linux x86_64, CUDA fatbin** (SASS \`sm_75/80/86/89/90\` + \`compute_90\` PTX; incorporates the static CUDA runtime/device runtime and dynamically links libgomp). CI compile-verifies this path; publication additionally requires the external H100 runtime gate.
          - \`xhdfe_xfe-stata-windows-cpu.zip\` — **Windows x86_64, CPU/OpenMP** (PE32+ plugins plus their validated MinGW runtime closure; intended for 64-bit Windows 10/11).
          - \`xhdfe_xfe-stata-macos-universal.zip\` — **macOS universal (x86_64 + arm64), CPU** (Mach-O bundle, no OpenMP). Unsigned/unnotarized: end users may need \`xattr -dr com.apple.quarantine xhdfe.plugin xfe.plugin\` before Stata loads them.

          ### Python and R packages
          - \`xhdfe-${EXPECTED_VERSION}-*manylinux*.whl\` — Linux x86_64 CPU
            wheel, installed and exercised from an isolated environment in CI.
          - \`xhdfe-${EXPECTED_VERSION}-*win_amd64.whl\` — Windows x86_64 CPU
            wheel built with Strawberry MinGW; its GNU runtime DLL closure is
            inspected and import-tested with Strawberry removed from \`PATH\`.
            Use the source distribution on other systems or Python ABIs.
          - \`xhdfe-${EXPECTED_VERSION}.tar.gz\` — Python source distribution.
          - \`xhdfe_${EXPECTED_VERSION}.tar.gz\` — R source package.

          ### Offline source bundle
          - \`xhdfe_xfe-offline-source-and-platform-binaries.zip\` — exact tagged
            sources, vendored offline build inputs, and the exact Linux CPU/CUDA,
            Windows x86_64 OpenMP, and macOS universal plugins from this workflow.
          - \`xhdfe-${EXPECTED_VERSION}-corresponding-source.zip\` — exact
            GNU/MinGW runtime sources, distribution patches/build recipes,
            provider source packages, license texts, and byte-level provenance
            for the runtime libraries carried by the release artifacts.

          ### Online net-install site snapshot
          - \`xhdfe_xfe-stata-netinstall-site.zip\` — the exact \`stata/\` tree published to \`gh-pages\` for online \`net install\`.

          ### Integrity
          - \`SHA256SUMS.txt\` — SHA-256 digest for every separately downloadable release asset.

          ## Build matrix
          | Platform | Backend | Runner | Notes |
          |---|---|---|---|
          | Linux x86_64 | Stata CPU/OpenMP | ubuntu-latest | portable, libgomp-linked |
          | Linux x86_64 | Stata CUDA fatbin | ubuntu-latest | sm_75/80/86/89/90 + compute_90 PTX; CI compile-verified, published release H100-certified externally |
          | Linux x86_64 | Python CPU wheel | manylinux_2_28 + ubuntu-latest | repaired manylinux wheel; clean installed-wheel formula smoke |
          | Windows x86_64 | Stata CPU/OpenMP | ubuntu-latest (mingw POSIX cross) | PE32+ plugins + validated colocated runtime DLL closure; intended for Windows 10/11 |
          | Windows x86_64, CPython 3.12 | Python CPU/OpenMP wheel | GitHub-hosted Windows x86-64 (Strawberry MinGW 5.42 / GCC 13.2) | generic recursive non-system DLL closure; intended for Windows 10/11; import and formula smoke without Strawberry on PATH |
          | macOS x86_64+arm64 | Stata CPU | macos-14 | universal bundle, no OpenMP |
          EOF
          echo "---- release body ----"
          cat release_body.md

      - name: Upload assembled release snapshot
        uses: actions/upload-artifact@v4
        with:
          name: assembled-release-${{ github.ref_name }}
          path: |
            release_assets
            release_body.md
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Version tags alone may turn the already-validated assembly artifact into a
  # DRAFT release. Publication remains a separate H100-certified marker job.
  # ---------------------------------------------------------------------------
  release:
    name: Stage DRAFT GitHub Release
    needs: [assemble-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assembled release snapshot
        uses: actions/download-artifact@v4
        with:
          name: assembled-release-${{ github.ref_name }}
          path: staged

      - name: Verify downloaded release snapshot
        run: |
          set -euo pipefail
          test -f staged/release_body.md
          test -f staged/release_assets/SHA256SUMS.txt
          ( cd staged/release_assets && sha256sum -c SHA256SUMS.txt )

      - name: Create DRAFT release with assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true                              # nothing public until a maintainer reviews + publishes
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: staged/release_body.md
          fail_on_unmatched_files: true
          files: |
            staged/release_assets/*.zip
            staged/release_assets/*.whl
            staged/release_assets/*.tar.gz
            staged/release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in token; no extra secrets

      - name: Keep release draft pending exact H100 validation
        run: |
          set -euo pipefail
          echo "Draft assets are ready for external runtime certification."
          echo "Download plugins-linux from this workflow run and exercise the exact"
          echo "CUDA fatbins on the H100. Publish only by pushing"
          echo "publish-${{ github.ref_name }} at this same commit after that gate passes."

  # ---------------------------------------------------------------------------
  # Publication marker: this job never rebuilds or substitutes artifacts. It
  # publishes the pre-existing draft and the net-install snapshot only after a
  # maintainer has validated the exact CUDA bytes from the version-tag run on
  # real hardware and pushes publish-v<version> at the same commit.
  # ---------------------------------------------------------------------------
  publish-certified:
    name: Publish H100-certified draft and net-install site
    if: startsWith(github.ref, 'refs/tags/publish-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve and verify target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="${GITHUB_REF_NAME#publish-}"
          test -n "$TARGET"
          TAG_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TARGET" \
            --jq '.object.type')"
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TARGET" \
            --jq '.object.sha')"
          if [ "$TAG_TYPE" = "tag" ]; then
            TARGET_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$TAG_SHA" \
              --jq '.object.sha')"
          elif [ "$TAG_TYPE" = "commit" ]; then
            TARGET_SHA="$TAG_SHA"
          else
            echo "ERROR: unsupported target tag object type: $TAG_TYPE" >&2
            exit 1
          fi
          test "$TARGET_SHA" = "$GITHUB_SHA" || {
              echo "ERROR: publish marker and version tag do not resolve to the same commit." >&2
              exit 1
            }
          test "$(gh release view "$TARGET" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft)" = "true" || {
              echo "ERROR: target release is absent or is no longer a draft." >&2
              exit 1
            }
          echo "TARGET_RELEASE=$TARGET" >> "$GITHUB_ENV"

      - name: Download exact net-install snapshot from draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p netinstall_site
          gh release download "$TARGET_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern xhdfe_xfe-stata-netinstall-site.zip
          unzip -q xhdfe_xfe-stata-netinstall-site.zip -d netinstall_site
          test -f netinstall_site/stata/xhdfe.pkg
          test -f netinstall_site/stata/xhdfegelbachbootstrap.ado

      - name: Publish certified Stata net-install site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./netinstall_site
          commit_message: Publish H100-certified Stata site for ${{ env.TARGET_RELEASE }}

      - name: Publish certified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TARGET_RELEASE" \
            --draft=false \
            --latest \
            --repo "$GITHUB_REPOSITORY"
