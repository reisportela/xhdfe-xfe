name: Release plugins

# A preflight-v* tag runs the build/test matrix and full release assembly
# without creating a release. workflow_dispatch runs the build/test matrix.
# A version tag (v*) assembles the same assets and creates a draft release.
# After the exact CI CUDA artifacts pass runtime validation on the maintainer
# H100, a matching publish-v* marker publishes that existing draft and its
# net-install snapshot.
on:
  push:
    tags:
      - 'preflight-v*' # build/test + assembly only; never creates or publishes a release
      - 'v*'           # build a draft release
      - 'publish-v*'   # publish only after exact CI CUDA assets pass H100 validation
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/name for the draft release (manual runs only; release job is skipped unless a tag ref triggers it)'
        required: false
        default: ''

# Required so the built-in GITHUB_TOKEN can create the release. No PAT/secret needed.
permissions:
  contents: write

# Avoid overlapping runs for the same ref clobbering each other's artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # CUDA fatbin SM targets. SM 70 dropped: the build scripts hard-reject arch < 75
  # (build-plugin.sh line ~289). H100 (sm_90) requires CUDA >= 12.0.
  XHDFE_CUDA_ARCHS: '75,80,86,89,90'

jobs:
  # ---------------------------------------------------------------------------
  # Linux runner: builds linux-cpu, linux-cuda-fatbin, and Windows x86_64
  # OpenMP plugins (mingw cross) for xhdfe and xfe. CI proves COMPILE + LINK only:
  # GitHub-hosted runners have NO GPU and NO Stata license.
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux (CPU + CUDA fatbin) and Windows/OpenMP
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/preflight-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify unified metadata and release tag
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(python3 -c 'import re;s=open("xhdfe/_version.py").read();print(re.search(r"__version__\s*=\s*\"([^\"]+)\"",s).group(1))')"
          python3 tools/validate_release_metadata.py \
            --expected-version "$EXPECTED_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v${EXPECTED_VERSION}" || {
              echo "ERROR: tag $GITHUB_REF_NAME does not match v${EXPECTED_VERSION}" >&2
              exit 1
            }
          elif [[ "$GITHUB_REF" == refs/tags/preflight-v* ]]; then
            PREFLIGHT_BASE="preflight-v${EXPECTED_VERSION}"
            if [[ "$GITHUB_REF_NAME" != "$PREFLIGHT_BASE" ]]; then
              ATTEMPT="${GITHUB_REF_NAME#"${PREFLIGHT_BASE}-r"}"
              test "$GITHUB_REF_NAME" = "${PREFLIGHT_BASE}-r${ATTEMPT}" \
                && [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]] || {
                  echo "ERROR: preflight tag $GITHUB_REF_NAME must be ${PREFLIGHT_BASE} or ${PREFLIGHT_BASE}-rN" >&2
                  exit 1
                }
            fi
          fi

      - name: Install toolchains (g++, mingw POSIX, binutils, curl, tar)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ binutils cmake curl ca-certificates tar gzip zip \
            g++-mingw-w64-x86-64 \
            python3-dev python3-pip python3-venv python3-numpy \
            python3-setuptools python3-wheel r-base-core r-cran-rcpp \
            r-cran-testthat
          sudo update-alternatives --set x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix
          x86_64-w64-mingw32-g++ --version

      - name: Cache build dependencies (Eigen, stplugin.h/.c)
        uses: actions/cache@v4
        with:
          path: stata/tools/_deps
          key: xhdfe-deps-${{ runner.os }}-eigen340-v1

      - name: Install CUDA toolkit (nvcc + cuobjdump — no driver/GPU)
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.6.3'                       # >=12.0 needed for sm_90; action default is 13.x, so pin explicitly
          method: 'network'
          # cuobjdump is required by the fatbin verification step below; nvcc alone
          # does not install it.
          sub-packages: '["nvcc", "cuobjdump"]'
          linux-local-args: '["--toolkit"]'

      - name: Verify nvcc / cuobjdump
        run: |
          set -euo pipefail
          nvcc --version
          echo "CUDA_PATH=${CUDA_PATH:-unset}"
          command -v cuobjdump && cuobjdump --version | head -2 || echo "WARN: cuobjdump not on PATH"

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      # ---- Linux ELF artifacts: built inside manylinux_2_28 (glibc 2.28 floor) ----
      # Release 2.21.0's Linux binaries were built directly on the Ubuntu runner
      # and required GLIBC_2.38/GLIBCXX_3.4.32, which does not load on
      # RHEL/AlmaLinux/Rocky 9 (glibc 2.34), Ubuntu 22.04, Debian 12 or SLES 15
      # — the Enterprise Linux platforms the stated audience runs (finding F-01).
      # Building in the manylinux_2_28 container (AlmaLinux 8 + gcc-toolset,
      # whose new C++ runtime parts link statically) pins the artifact floor at
      # GLIBC_2.28/GLIBCXX_3.4.25. The script fail-closed-gates every ELF with
      # tools/check_binary_floor.sh before it returns.
      - name: Build linux-cpu + linux-cuda + Python wheel/sdist (manylinux_2_28)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w \
            -e XHDFE_CUDA_ARCHS="$XHDFE_CUDA_ARCHS" \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash ci/build_linux_release_manylinux.sh

      - name: Enforce glibc floor on Linux artifacts (fail-closed, host-side re-check)
        run: |
          set -euo pipefail
          bash tools/check_binary_floor.sh \
            artifacts/xhdfe.plugin.linux-cpu artifacts/xfe.plugin.linux-cpu \
            artifacts/xhdfe.plugin.linux-cuda artifacts/xfe.plugin.linux-cuda
          WHEELS=(artifacts/xhdfe-*.whl)
          test "${#WHEELS[@]}" -eq 1
          STAGE="$(mktemp -d)"
          python3 -m zipfile -e "${WHEELS[0]}" "$STAGE"
          find "$STAGE" -name '*.so' -print0 | xargs -0 bash tools/check_binary_floor.sh
          rm -rf "$STAGE"

      - name: Verify linux-cpu plugins (ELF + libgomp)
        run: |
          set -euo pipefail
          for f in artifacts/xhdfe.plugin.linux-cpu artifacts/xfe.plugin.linux-cpu; do
            test -f "$f" || { echo "MISSING: $f" >&2; exit 1; }
            ls -la "$f"; file "$f"
            file "$f" | grep -q 'ELF 64-bit' || { echo "ERROR: not an ELF object: $f" >&2; exit 1; }
            echo "-- ldd (libgomp expected) --"
            ldd "$f" || true
            ldd "$f" | grep -q libgomp || { echo "ERROR: libgomp not linked in $f (OpenMP missing)" >&2; exit 1; }
          done

      # Linux CUDA fatbin plugins are built by the manylinux step above
      # (sm_75/80/86/89/90 + compute_90 PTX). Compile/link verified only — no
      # GPU on CI. Maintainer validates on H100.
      - name: Verify linux-cuda fatbin plugins (compile-verified only; no GPU)
        run: |
          set -euo pipefail
          CUOBJDUMP=""
          if command -v cuobjdump >/dev/null 2>&1; then
            CUOBJDUMP="$(command -v cuobjdump)"
          elif [ -x "${CUDA_PATH:-/usr/local/cuda}/bin/cuobjdump" ]; then
            CUOBJDUMP="${CUDA_PATH:-/usr/local/cuda}/bin/cuobjdump"
          fi
          for f in artifacts/xhdfe.plugin.linux-cuda artifacts/xfe.plugin.linux-cuda; do
            test -f "$f" || { echo "MISSING: $f" >&2; exit 1; }
            ls -la "$f"; file "$f"
            file "$f" | grep -q 'ELF 64-bit' || { echo "ERROR: not an ELF object: $f" >&2; exit 1; }
            echo "-- ldd (libgomp expected; CUDA runtime is STATICALLY linked, so libcudart will NOT appear here) --"
            ldd "$f" || true
            ldd "$f" | grep -q libgomp || { echo "ERROR: libgomp not linked in $f (OpenMP missing)" >&2; exit 1; }
            # Do NOT assert libcudart via ldd: the plugin links libcudart_static (nvcc default),
            # so it is intentionally absent from ldd. Embedded CUDA code is proven by cuobjdump below.
            if [ -n "$CUOBJDUMP" ]; then
              echo "-- embedded SASS arches ($CUOBJDUMP --list-elf) --"
              "$CUOBJDUMP" --list-elf "$f" || true
              echo "-- embedded PTX ($CUOBJDUMP --list-ptx) --"
              "$CUOBJDUMP" --list-ptx "$f" || true
              for arch in sm_75 sm_80 sm_86 sm_89 sm_90; do
                "$CUOBJDUMP" --list-elf "$f" | grep -q "$arch" \
                  || { echo "ERROR: $arch missing from fatbin in $f" >&2; exit 1; }
              done
              # cuobjdump --list-ptx labels the forward-compat PTX as "sm_90.ptx"
              # (named by the SM target, though it is compute_90 virtual PTX).
              "$CUOBJDUMP" --list-ptx "$f" | grep -qE 'sm_90|compute_90' \
                || { echo "ERROR: sm_90/compute_90 PTX missing from fatbin in $f" >&2; exit 1; }
              echo "OK: fatbin contains sm_75/80/86/89/90 SASS + compute_90 PTX"
            else
              # Do not silently pass if the fatbin cannot be inspected at all.
              echo "ERROR: cuobjdump unavailable; cannot verify fatbin arches for $f" >&2
              exit 1
            fi
          done

      # ---- Windows x86_64 CPU/OpenMP (mingw POSIX cross-compile) ----
      # OpenMP is mandatory for production plugins. The two runtime DLLs are
      # shipped beside the plugins so Windows' DLL loader resolves them from the
      # package directory without a machine-wide installation.
      - name: Build windows-cpu OpenMP (xhdfe + xfe, mingw cross)
        run: |
          set -euo pipefail
          bash stata/tools/build-plugin.sh --windows --openmp
          cp stata/xhdfe.plugin artifacts/xhdfe.plugin.windows
          bash stata/tools/build-xfe-plugin.sh --windows --openmp
          cp stata/xfe.plugin artifacts/xfe.plugin.windows
          LIBGOMP="$(x86_64-w64-mingw32-g++ -print-file-name=libgomp-1.dll)"
          LIBWINPTHREAD="$(x86_64-w64-mingw32-g++ -print-file-name=libwinpthread-1.dll)"
          test -f "$LIBGOMP"
          test -f "$LIBWINPTHREAD"
          cp "$LIBGOMP" artifacts/libgomp-1.dll
          cp "$LIBWINPTHREAD" artifacts/libwinpthread-1.dll

      - name: Verify windows-cpu plugins (PE32+ + OpenMP runtime)
        run: |
          set -euo pipefail
          for f in artifacts/xhdfe.plugin.windows artifacts/xfe.plugin.windows; do
            test -f "$f"
            file "$f" | grep -Eq 'PE32\+|PE32 '
            file "$f" | grep -q 'ELF' && {
              echo "ERROR: $f is ELF, not a Windows PE plugin." >&2
              exit 1
            }
            x86_64-w64-mingw32-objdump -p "$f" |
              grep -qi 'DLL Name: libgomp-1.dll' || {
                echo "ERROR: OpenMP runtime dependency missing in $f." >&2
                exit 1
              }
          done
          for f in artifacts/libgomp-1.dll artifacts/libwinpthread-1.dll; do
            test -f "$f"
            file "$f" | grep -Eq 'PE32\+|PE32 '
          done

      - name: Smoke-test manylinux Python wheel and build R source package
        run: |
          set -euo pipefail
          # Wheel + sdist come from the manylinux container step (glibc-2.28
          # floor); the smoke below proves the container-built wheel loads and
          # runs on this newer-glibc host (forward compatibility).
          # Single source of truth for the expected version: xhdfe/_version.py.
          python3 -c 'import re;s=open("xhdfe/_version.py").read();print(re.search(r"__version__\s*=\s*\"([^\"]+)\"",s).group(1))' > /tmp/xhdfe-expected-version
          EXPECTED_VERSION="$(cat /tmp/xhdfe-expected-version)"
          echo "expected version: $EXPECTED_VERSION"
          python3 -m venv --system-site-packages /tmp/xhdfe-wheel-smoke
          WHEELS=(artifacts/xhdfe-*.whl)
          SDISTS=(artifacts/xhdfe-*.tar.gz)
          test "${#WHEELS[@]}" -eq 1
          test "${#SDISTS[@]}" -eq 1
          python3 tools/validate_python_release_artifacts.py \
            --wheel "${WHEELS[0]}" \
            --sdist "${SDISTS[0]}" \
            --expected-version "$EXPECTED_VERSION"
          /tmp/xhdfe-wheel-smoke/bin/python -m pip install \
            --no-deps "${WHEELS[0]}"
          (
            cd /tmp
            /tmp/xhdfe-wheel-smoke/bin/python -c \
              'import sys; import numpy as np; import xhdfe; from xhdfe import feols, gelbach; assert "formulaic" not in sys.modules; rng=np.random.default_rng(221); n=300; x=rng.normal(size=(n,1)); z=rng.normal(size=(n,2)); y=x[:,0]+z@np.array([.4,-.2])+rng.normal(size=n); out=gelbach.decompose(y,x,{"controls":z}); assert out["identity_gap"] < 1e-10; assert xhdfe.__version__ == open("/tmp/xhdfe-expected-version").read().strip(); assert callable(feols); assert "formulaic" not in sys.modules; print("PYTHON_WHEEL_BASE_SMOKE_PASS")'
          )
          /tmp/xhdfe-wheel-smoke/bin/python -m pip install "${WHEELS[0]}[formula]"
          /tmp/xhdfe-wheel-smoke/bin/python -m pip install 'formulaic==1.2.1'
          /tmp/xhdfe-wheel-smoke/bin/python -m pip check
          cp tests/test_formula_frontend.py /tmp/test_formula_frontend.py
          (
            cd /tmp
            /tmp/xhdfe-wheel-smoke/bin/python - <<'PY'
          import formulaic
          import pandas
          import unittest

          suite = unittest.defaultTestLoader.loadTestsFromName("test_formula_frontend")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or result.testsRun != 35:
              raise SystemExit(
                  f"formula wheel gate expected 35 passing tests without skips; "
                  f"ran={result.testsRun}, skipped={result.skipped}"
              )
          print("PYTHON_WHEEL_FORMULA_SUITE_PASS")
          PY
          )
          python3 -m venv --system-site-packages /tmp/xhdfe-sdist-smoke
          /tmp/xhdfe-sdist-smoke/bin/python -m pip install \
            --no-deps "${SDISTS[0]}"
          (
            cd /tmp
            /tmp/xhdfe-sdist-smoke/bin/python -c \
              'import xhdfe; from xhdfe import HdfeRegressor; assert xhdfe.__version__ == open("/tmp/xhdfe-expected-version").read().strip(); assert HdfeRegressor is not None; print("PYTHON_SDIST_REBUILD_SMOKE_PASS")'
          )
          python3 -m unittest -v tests.test_windows_runtime_packaging
          R CMD build --no-build-vignettes --no-manual r/xhdfe
          R_TARBALL="xhdfe_${EXPECTED_VERSION}.tar.gz"
          test -f "$R_TARBALL"
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check \
            --no-build-vignettes --no-manual "$R_TARBALL"
          mv "$R_TARBALL" artifacts/
          ls -la artifacts/xhdfe-*.whl artifacts/xhdfe-*.tar.gz \
            artifacts/xhdfe_*.tar.gz

      - name: Upload Linux/Windows plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins-linux            # MUST be unique per job (v4 artifacts are immutable)
          path: |
            artifacts/xhdfe.plugin.linux-cpu
            artifacts/xfe.plugin.linux-cpu
            artifacts/xhdfe.plugin.linux-cuda
            artifacts/xfe.plugin.linux-cuda
            artifacts/xhdfe.plugin.windows
            artifacts/xfe.plugin.windows
            artifacts/libgomp-1.dll
            artifacts/libwinpthread-1.dll
            artifacts/xhdfe-*.whl
            artifacts/xhdfe-*.tar.gz
            artifacts/xhdfe_*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Windows runner: build the Python wheel with Strawberry Perl's MinGW and
  # prove that its compiled extension imports after the compiler directory is
  # removed from PATH. This is the end-to-end gate for the packaged GNU runtime
  # DLL closure used by CPython 3.8+.
  # ---------------------------------------------------------------------------
  build-windows-python:
    name: Build/import Windows Python wheel (Strawberry MinGW)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/preflight-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Strawberry Perl MinGW toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco install strawberryperl --no-progress -y
          $strawberryBin = 'C:\Strawberry\c\bin'
          if (-not (Test-Path "$strawberryBin\g++.exe")) {
            throw "Strawberry MinGW compiler not found at $strawberryBin"
          }
          $strawberryBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and inspect MinGW wheel
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip setuptools wheel cmake numpy
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $env:XHDFE_ENABLE_CUDA = 'OFF'
          $env:CMAKE_ARGS = '-G "MinGW Makefiles" -DCMAKE_CXX_COMPILER=C:/Strawberry/c/bin/g++.exe -DXHDFE_ENABLE_MARCH_NATIVE=OFF'
          python -m pip wheel . --no-build-isolation --no-deps --wheel-dir artifacts
          $expected = python -c 'import re; s=open("xhdfe/_version.py").read(); print(re.search(r"__version__\s*=\s*\"([^\"]+)\"", s).group(1))'
          $wheel = Get-ChildItem artifacts\xhdfe-*.whl
          if ($wheel.Count -ne 1) { throw "Expected one Windows wheel, found $($wheel.Count)" }
          python tools/validate_python_release_artifacts.py `
            --wheel $wheel.FullName `
            --expected-version $expected `
            --mingw-objdump C:\Strawberry\c\bin\objdump.exe

      - name: Import wheel without Strawberry on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $wheel = Get-ChildItem artifacts\xhdfe-*.whl
          python -m venv $env:RUNNER_TEMP\xhdfe-wheel-smoke
          $python = "$env:RUNNER_TEMP\xhdfe-wheel-smoke\Scripts\python.exe"
          & $python -m pip install --upgrade pip
          & $python -m pip install $wheel.FullName
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -and $_.TrimEnd('\') -ine 'C:\Strawberry\c\bin'
          }) -join ';'
          Push-Location $env:RUNNER_TEMP
          try {
            $packageDir = & $python -c 'import importlib.util, pathlib; s=importlib.util.find_spec("xhdfe"); print(pathlib.Path(next(iter(s.submodule_search_locations))).resolve())'
            Write-Host "Installed package directory: $packageDir"
            Get-ChildItem $packageDir -File | Where-Object {
              $_.Extension -in '.pyd', '.dll'
            } | Sort-Object Name | Format-Table Name, Length
            Get-ChildItem $packageDir -File | Where-Object {
              $_.Extension -in '.pyd', '.dll'
            } | Sort-Object Name | ForEach-Object {
              Write-Host "PE dependencies: $($_.Name)"
              & C:\Strawberry\c\bin\objdump.exe -p $_.FullName |
                Select-String 'DLL Name:'
            }
            & $python -c 'import pathlib, numpy as np, xhdfe; p=pathlib.Path(xhdfe.__file__).resolve().parent; print(f"xhdfe package: {p}", flush=True); print(f"DLL handles: {tuple(xhdfe._PACKAGED_DLL_DIRECTORY_HANDLES)}", flush=True); from xhdfe import HdfeRegressor; x=np.arange(30., dtype=float).reshape(-1,1); y=1.5+2*x[:,0]; m=HdfeRegressor(); m.fit(y,x); assert np.allclose(m.coef_, [2.,1.5]); print("WINDOWS_WHEEL_BASE_IMPORT_PASS")'
            & $python -c 'import py_hdfe_v11 as legacy, xhdfe; assert legacy.HdfeRegressor is xhdfe.HdfeRegressor; print("WINDOWS_WHEEL_LEGACY_IMPORT_PASS")'
            & $python -m pip install "$($wheel.FullName)[formula]"
            & $python -m pip check
            & $python -c 'import numpy as np, pandas as pd, xhdfe; rng=np.random.default_rng(240814); n=180; d=pd.DataFrame({"x":rng.normal(size=n),"g":rng.choice(["a","b","c"],n),"firm":rng.integers(0,18,n),"year":rng.integers(0,7,n)}); d["y"]=1+2*d["x"]+(d["g"]=="b")*.4+rng.normal(scale=.1,size=n); m=xhdfe.feols("y ~ C(g)*x | firm + year",data=d); assert m.converged_ and np.isfinite(m.coef_).all(); print("WINDOWS_WHEEL_FORMULA_PASS")'
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows Python wheel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugins-windows-python
          path: artifacts/xhdfe-*.whl
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # macOS Apple Silicon runner: builds a universal (x86_64 + arm64) Mach-O
  # bundle for both xhdfe and xfe. No OpenMP (Apple clang rejects bare -fopenmp;
  # the script forces OpenMP OFF on Darwin). The xfe script is run under Homebrew
  # bash 5.x to dodge a `set -u` empty `metal_flags[@]` bug present only in
  # build-xfe-plugin.sh (breaks under macOS stock bash 3.2).
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS universal (CPU, no OpenMP)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/preflight-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14                    # arm64 / Apple Silicon
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache build dependencies (Eigen, stplugin.h/.c)
        uses: actions/cache@v4
        with:
          path: stata/tools/_deps
          key: xhdfe-deps-${{ runner.os }}-eigen340-v1

      - name: Install bash 5.x (for the xfe build script's empty-array safety)
        run: |
          set -euo pipefail
          brew install bash
          BREW_BASH="$(brew --prefix)/bin/bash"
          "$BREW_BASH" --version | head -1
          echo "BREW_BASH=$BREW_BASH" >> "$GITHUB_ENV"

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      # macOS: do NOT pass --openmp (Apple clang rejects bare -fopenmp; the script
      # forces OpenMP off on Darwin anyway). Pass --linux: on Darwin the script maps
      # it to the Unix path but the Darwin-specific -bundle/lipo/APPLEMAC branches
      # still fire because they key on `uname -s == Darwin`. Always builds a
      # universal x86_64+arm64 bundle.
      - name: Build macos universal (xhdfe + xfe)
        run: |
          set -euo pipefail
          bash stata/tools/build-plugin.sh --linux
          cp stata/xhdfe.plugin artifacts/xhdfe.plugin.macos
          # Run xfe under Homebrew bash 5.x if available, else fall back to /bin/bash.
          BREW_BASH="${BREW_BASH:-$(brew --prefix)/bin/bash}"
          if [ -x "$BREW_BASH" ]; then
            echo "Using Homebrew bash: $BREW_BASH"
            "$BREW_BASH" stata/tools/build-xfe-plugin.sh --linux
          else
            echo "WARN: Homebrew bash not found; falling back to system bash (3.2 metal_flags bug risk)"
            bash stata/tools/build-xfe-plugin.sh --linux
          fi
          cp stata/xfe.plugin artifacts/xfe.plugin.macos

      - name: Ad-hoc codesign (cosmetic; not notarized)
        run: |
          set -euo pipefail
          codesign -s - --force artifacts/xhdfe.plugin.macos || true
          codesign -s - --force artifacts/xfe.plugin.macos || true

      - name: "Verify macos universal plugins (Mach-O fat: x86_64 + arm64)"
        run: |
          set -euo pipefail
          for f in artifacts/xhdfe.plugin.macos artifacts/xfe.plugin.macos; do
            test -f "$f" || { echo "MISSING: $f" >&2; exit 1; }
            ls -la "$f"; file "$f"
            file "$f" | grep -q 'Mach-O' \
              || { echo "ERROR: not a Mach-O object: $f" >&2; exit 1; }
            echo "-- lipo -archs --"
            lipo -archs "$f" || true
            # arm64 is the required target ("Mac ARM"); x86_64 is a bonus universal slice.
            lipo -archs "$f" | grep -q 'arm64'  || { echo "ERROR: missing arm64 slice in $f"  >&2; exit 1; }
            lipo -archs "$f" | grep -q 'x86_64' && echo "OK: universal (also has x86_64)" || echo "NOTE: arm64-only (no x86_64 slice) -- acceptable for Mac ARM"
            echo "-- otool -L --"
            otool -L "$f" || true
          done

      - name: Upload macOS plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plugins-macos            # unique per job (v4 immutability)
          path: |
            artifacts/xhdfe.plugin.macos
            artifacts/xfe.plugin.macos
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Release staging: assemble and validate per-platform Stata bundles, raw CUDA
  # fatbins, Python/R packages, the offline source/runtime ZIP, and net-install
  # snapshot. This runs for preflight and version tags with read-only contents.
  # ---------------------------------------------------------------------------
  assemble-release:
    name: Assemble and validate release snapshot
    needs: [build-linux, build-windows-python, build-macos]
    if: startsWith(github.ref, 'refs/tags/preflight-v') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip + python (for bundle assembly / offline packaging)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip python3

      - name: Download all plugin artifacts
        uses: actions/download-artifact@v4
        with:
          path: dl
          pattern: plugins-*
          merge-multiple: true           # flatten plugins-linux + plugins-macos into dl/

      - name: List downloaded plugins (fail-fast on any missing REQUIRED variant)
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "== downloaded artifacts =="
          ls -la dl
          # Required set: Linux CPU + Linux CUDA + Windows/OpenMP + macOS.
          for f in \
            dl/xhdfe.plugin.linux-cpu dl/xfe.plugin.linux-cpu \
            dl/xhdfe.plugin.linux-cuda dl/xfe.plugin.linux-cuda \
            dl/xhdfe.plugin.windows dl/xfe.plugin.windows \
            dl/libgomp-1.dll dl/libwinpthread-1.dll \
            dl/xhdfe.plugin.macos dl/xfe.plugin.macos ; do
            test -f "$f" || { echo "MISSING required plugin: $f" >&2; exit 1; }
          done
          PY_WHEELS=(dl/xhdfe-*.whl)
          PY_SDISTS=(dl/xhdfe-*.tar.gz)
          R_TARBALLS=(dl/xhdfe_*.tar.gz)
          test "${#PY_WHEELS[@]}" -eq 2
          LINUX_PY_WHEELS=(dl/xhdfe-*manylinux*.whl)
          WINDOWS_PY_WHEELS=(dl/xhdfe-*win_amd64.whl)
          test "${#LINUX_PY_WHEELS[@]}" -eq 1
          test "${#WINDOWS_PY_WHEELS[@]}" -eq 1
          test "${#PY_SDISTS[@]}" -eq 1
          test "${#R_TARBALLS[@]}" -eq 1

      - name: Assemble per-platform Stata bundles + release assets
        run: |
          set -euo pipefail
          mkdir -p release_assets

          # Shared, platform-independent Stata package files.
          SHARED=(
            stata/LICENSE stata/NOTICE
            stata/xhdfe.ado stata/xhdfe.sthlp stata/xhdfe.pkg
            stata/xhdfe_p.ado stata/xhdfe_estat.ado
            stata/xhdfeakm.ado stata/xhdfeakm.sthlp
            stata/xhdfeconnected.ado stata/xhdfeconnected.sthlp
            stata/xhdfegelbach.ado stata/xhdfegelbach.sthlp
            stata/xhdfegelbachbootstrap.ado stata/xhdfegelbachbootstrap.sthlp
            stata/xhdfegelbachetable.ado stata/xhdfegelbachetable.sthlp
            stata/xhdfegelbachcoefplot.ado stata/xhdfegelbachcoefplot.sthlp
            stata/xhdfegpu.ado stata/xhdfegpu.sthlp
            stata/xfe.ado stata/xfe.sthlp stata/xfe.pkg
            stata/stata.toc
          )
          for s in "${SHARED[@]}"; do
            test -f "$s" || { echo "MISSING shared Stata file: $s" >&2; exit 1; }
          done

          # bundle <zipname> <xhdfe-plugin-src> <xfe-plugin-src>
          # Stages the platform plugins under canonical names + the shared files,
          # then zips. The canonical names (xhdfe.plugin / xfe.plugin) are what
          # Stata loads at runtime.
          bundle() {
            local zipname="$1" xhdfe_src="$2" xfe_src="$3"
            shift 3
            test -f "$xhdfe_src" || { echo "MISSING plugin src: $xhdfe_src" >&2; exit 1; }
            test -f "$xfe_src"   || { echo "MISSING plugin src: $xfe_src"   >&2; exit 1; }
            local stage; stage="$(mktemp -d)"
            cp "$xhdfe_src" "$stage/xhdfe.plugin"
            cp "$xfe_src"   "$stage/xfe.plugin"
            local s
            for s in "${SHARED[@]}"; do cp "$s" "$stage/"; done
            for s in "$@"; do
              test -f "$s" || { echo "MISSING runtime dependency: $s" >&2; exit 1; }
              cp "$s" "$stage/"
            done
            ( cd "$stage" && zip -q -r -X "$GITHUB_WORKSPACE/release_assets/$zipname" . )
            rm -rf "$stage"
            echo "built release_assets/$zipname"
            unzip -l "release_assets/$zipname"
          }

          bundle xhdfe_xfe-stata-linux-cpu.zip       dl/xhdfe.plugin.linux-cpu  dl/xfe.plugin.linux-cpu
          bundle xhdfe_xfe-stata-linux-cuda.zip      dl/xhdfe.plugin.linux-cuda dl/xfe.plugin.linux-cuda
          bundle xhdfe_xfe-stata-macos-universal.zip dl/xhdfe.plugin.macos      dl/xfe.plugin.macos
          bundle xhdfe_xfe-stata-windows-cpu.zip \
            dl/xhdfe.plugin.windows dl/xfe.plugin.windows \
            dl/libgomp-1.dll dl/libwinpthread-1.dll

          # Also attach the raw CUDA fatbin plugins separately (for direct H100 validation).
          cp dl/xhdfe.plugin.linux-cuda release_assets/xhdfe-linux-cuda.plugin
          cp dl/xfe.plugin.linux-cuda   release_assets/xfe-linux-cuda.plugin
          cp dl/xhdfe-*.whl dl/xhdfe-*.tar.gz dl/xhdfe_*.tar.gz release_assets/

          # Source-only archive used by xhdfegpu and offline local builds.
          # The builder performs its own closure and pinned-Rcpp validation.
          bash tools/make_source_dist_zip.sh \
            "$GITHUB_WORKSPACE/release_assets/xhdfe-src.zip"

          # ---- Autonomous offline source + multi-platform runtime bundle ----
          # Build from the exact tagged tree; never select a historical dist/*.zip.
          # The archive contains every tracked source/build input (including vendored
          # Eigen, pybind11, Rcpp, and stplugin inputs) plus the exact CI Linux,
          # Windows, and macOS plugins. CI itself proves compile/link only. Publication remains
          # blocked until those exact CUDA bytes are downloaded from this run and
          # exercised on the maintainer H100; only then is a publish-v* marker pushed.
          OFFLINE_NAME="xhdfe_xfe-offline-source-and-platform-binaries.zip"
          OFFLINE_STAGE="$(mktemp -d)"
          git archive --format=tar HEAD | tar -xf - -C "$OFFLINE_STAGE"
          mkdir -p "$OFFLINE_STAGE/prebuilt/linux_x86_64"
          cp dl/xhdfe.plugin.linux-cpu \
            "$OFFLINE_STAGE/prebuilt/linux_x86_64/xhdfe_cpu.plugin"
          cp dl/xfe.plugin.linux-cpu \
            "$OFFLINE_STAGE/prebuilt/linux_x86_64/xfe_cpu.plugin"
          cp dl/xhdfe.plugin.linux-cuda \
            "$OFFLINE_STAGE/prebuilt/linux_x86_64/xhdfe_cuda_fatbin.plugin"
          cp dl/xfe.plugin.linux-cuda \
            "$OFFLINE_STAGE/prebuilt/linux_x86_64/xfe_cuda_fatbin.plugin"
          mkdir -p "$OFFLINE_STAGE/prebuilt/windows_x86_64"
          cp dl/xhdfe.plugin.windows \
            "$OFFLINE_STAGE/prebuilt/windows_x86_64/xhdfe.plugin"
          cp dl/xfe.plugin.windows \
            "$OFFLINE_STAGE/prebuilt/windows_x86_64/xfe.plugin"
          cp dl/libgomp-1.dll dl/libwinpthread-1.dll \
            "$OFFLINE_STAGE/prebuilt/windows_x86_64/"
          mkdir -p "$OFFLINE_STAGE/prebuilt/macos_universal"
          cp dl/xhdfe.plugin.macos \
            "$OFFLINE_STAGE/prebuilt/macos_universal/xhdfe.plugin"
          cp dl/xfe.plugin.macos \
            "$OFFLINE_STAGE/prebuilt/macos_universal/xfe.plugin"
          mkdir -p "$OFFLINE_STAGE/packages/python" "$OFFLINE_STAGE/packages/R"
          cp dl/xhdfe-*.whl dl/xhdfe-*.tar.gz \
            "$OFFLINE_STAGE/packages/python/"
          cp dl/xhdfe_*.tar.gz "$OFFLINE_STAGE/packages/R/"
          cp dl/xhdfe.plugin.linux-cpu "$OFFLINE_STAGE/stata/xhdfe.plugin"
          cp dl/xfe.plugin.linux-cpu "$OFFLINE_STAGE/stata/xfe.plugin"
          cat > "$OFFLINE_STAGE/OFFLINE_ARTIFACT_SCOPE.md" <<'EOF'
          # Offline artifact scope

          This archive is generated from the exact tagged Git tree and contains
          the installable Stata package, C++/CUDA/Python/R/Stata sources, build
          scripts, package metadata, validation programs, and vendored third-party
          inputs required by the documented offline build paths. It also contains
          the release Python wheel/source distribution and R source package.

          `stata/xhdfe.plugin` and `stata/xfe.plugin` are portable Linux CPU/OpenMP
          defaults. `prebuilt/` also contains the exact Linux CUDA fatbins,
          Windows x86_64 OpenMP plugins and runtime DLLs, and macOS universal
          plugins from the release workflow.

          GitHub-hosted CI has no Stata licence or GPU and therefore certifies only
          compilation, linking, binary format, OpenMP linkage, and embedded CUDA
          architectures. The release remains a draft until the exact CUDA plugins
          from this workflow have been executed successfully on the maintainer H100.
          The `publish-v*` marker records completion of that external runtime gate.
          EOF
          (
            cd "$OFFLINE_STAGE"
            find . -type f ! -name MANIFEST.sha256 -print0 |
              sort -z |
              xargs -0 sha256sum > MANIFEST.sha256
            sha256sum -c MANIFEST.sha256
            zip -q -r -X "$GITHUB_WORKSPACE/release_assets/$OFFLINE_NAME" .
          )
          rm -rf "$OFFLINE_STAGE"
          echo "built release_assets/$OFFLINE_NAME"

          # ---- Online Stata net-install site ----
          # This is the unpacked site published to the gh-pages branch.  The
          # generated .pkg files use Stata platform-specific g lines, so one URL
          # can serve Linux, macOS, and Windows when the corresponding plugin
          # artifacts are present.
          bash tools/stage_stata_netinstall_site.sh "$GITHUB_WORKSPACE/netinstall_site/stata" \
            --linux-xhdfe dl/xhdfe.plugin.linux-cpu \
            --linux-xfe   dl/xfe.plugin.linux-cpu \
            --macos-xhdfe dl/xhdfe.plugin.macos \
            --macos-xfe   dl/xfe.plugin.macos \
            --windows-xhdfe dl/xhdfe.plugin.windows \
            --windows-xfe   dl/xfe.plugin.windows \
            --windows-libgomp dl/libgomp-1.dll \
            --windows-libwinpthread dl/libwinpthread-1.dll
          cp release_assets/xhdfe-src.zip netinstall_site/stata/xhdfe-src.zip
          bash tools/validate_stata_package_site.sh \
            "$GITHUB_WORKSPACE/netinstall_site/stata"
          ( cd "$GITHUB_WORKSPACE/netinstall_site" && zip -q -r -X "$GITHUB_WORKSPACE/release_assets/xhdfe_xfe-stata-netinstall-site.zip" . )
          echo "built release_assets/xhdfe_xfe-stata-netinstall-site.zip"

          (
            cd release_assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

          echo "== final release assets =="
          ls -la release_assets

      - name: Write release notes body
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(python3 -c 'import re;s=open("xhdfe/_version.py").read();print(re.search(r"__version__\s*=\s*\"([^\"]+)\"",s).group(1))')"
          RELEASE_NOTES="docs/releases/RELEASE_NOTES_${EXPECTED_VERSION}.md"
          test -f "$RELEASE_NOTES" || {
            echo "ERROR: missing tagged release notes: $RELEASE_NOTES" >&2
            exit 1
          }
          cp "$RELEASE_NOTES" release_body.md
          cat >> release_body.md <<EOF

          ---

          ## Release assets and installation

          Stata plugins built automatically on GitHub-hosted runners.

          > GitHub-hosted CI imports and exercises the Python wheels and runs
          > \`R CMD check\`. For the Stata plugins it proves **COMPILE + LINK only**:
          > the runners have **no Stata license**, and they have **no GPU** for CUDA
          > runtime validation. The workflow initially stages this release as a
          > draft and permits publication only after the exact attached plugins pass
          > Stata CPU/CUDA functional validation on real hardware (an NVIDIA H100,
          > \`sm_90\`). A published release therefore records completion of that
          > external gate.

          ## Online Stata install

          The \`publish-v*\` gate publishes the exact H100-certified snapshot to
          \`gh-pages\`. Stata can install the OS-appropriate plugin from one URL:

          \`\`\`stata
          net install xhdfe, from("https://raw.githubusercontent.com/reisportela/xhdfe-xfe/gh-pages/stata") replace
          net install xfe,   from("https://raw.githubusercontent.com/reisportela/xhdfe-xfe/gh-pages/stata") replace
          \`\`\`

          The online \`.pkg\` files use Stata's platform-specific \`g\` lines:
          Linux installs the portable CPU/OpenMP plugin, macOS installs the
          universal CPU plugin, and Windows installs the Windows plugin when that
          build artifact exists.

          ## Assets

          ### Per-platform Stata bundles (plugin renamed to canonical \`xhdfe.plugin\` / \`xfe.plugin\` + shared ado/sthlp/pkg/stata.toc)
          - \`xhdfe_xfe-stata-linux-cpu.zip\` — **Linux x86_64, CPU/OpenMP** (portable ELF, links libgomp; no \`-march=native\`).
          - \`xhdfe_xfe-stata-linux-cuda.zip\` — **Linux x86_64, CUDA fatbin** (SASS \`sm_75/80/86/89/90\` + \`compute_90\` PTX; links libcudart + libgomp). CI compile-verifies this path; publication additionally requires the external H100 runtime gate.
          - \`xhdfe_xfe-stata-windows-cpu.zip\` — **Windows 11 x86_64, CPU/OpenMP** (PE32+ plugins plus the required \`libgomp-1.dll\` and \`libwinpthread-1.dll\` runtime files).
          - \`xhdfe_xfe-stata-macos-universal.zip\` — **macOS universal (x86_64 + arm64), CPU** (Mach-O bundle, no OpenMP). Unsigned/unnotarized: end users may need \`xattr -dr com.apple.quarantine xhdfe.plugin xfe.plugin\` before Stata loads them.

          ### Raw CUDA fatbin plugins (for direct H100 validation and reproducibility)
          - \`xhdfe-linux-cuda.plugin\`, \`xfe-linux-cuda.plugin\` — the same Linux CUDA binaries as in the CUDA bundle, attached standalone.

          ### Python and R packages
          - \`xhdfe-${EXPECTED_VERSION}-*manylinux*.whl\` — Linux x86_64 CPU
            wheel, installed and exercised from an isolated environment in CI.
          - \`xhdfe-${EXPECTED_VERSION}-*win_amd64.whl\` — Windows x86_64 CPU
            wheel built with Strawberry MinGW; its GNU runtime DLL closure is
            inspected and import-tested with Strawberry removed from \`PATH\`.
            Use the source distribution on other systems or Python ABIs.
          - \`xhdfe-${EXPECTED_VERSION}.tar.gz\` — Python source distribution.
          - \`xhdfe_${EXPECTED_VERSION}.tar.gz\` — R source package.

          ### Offline source bundle
          - \`xhdfe_xfe-offline-source-and-platform-binaries.zip\` — exact tagged
            sources, vendored offline build inputs, and the exact Linux CPU/CUDA,
            Windows 11 x86_64 OpenMP, and macOS universal plugins from this workflow.

          ### Online net-install site snapshot
          - \`xhdfe_xfe-stata-netinstall-site.zip\` — the exact \`stata/\` tree published to \`gh-pages\` for online \`net install\`.

          ### Integrity
          - \`SHA256SUMS.txt\` — SHA-256 digest for every separately downloadable release asset.

          ## Build matrix
          | Platform | Backend | Runner | Notes |
          |---|---|---|---|
          | Linux x86_64 | Stata CPU/OpenMP | ubuntu-latest | portable, libgomp-linked |
          | Linux x86_64 | Stata CUDA fatbin | ubuntu-latest | sm_75/80/86/89/90 + compute_90 PTX; CI compile-verified, published release H100-certified externally |
          | Linux x86_64 | Python CPU wheel | manylinux_2_28 + ubuntu-latest | repaired manylinux wheel; clean installed-wheel formula smoke |
          | Windows 11 x86_64 | Stata CPU/OpenMP | ubuntu-latest (mingw POSIX cross) | PE32+ plugins + colocated OpenMP runtime DLLs |
          | Windows 11 x86_64 | Python CPU/OpenMP wheel | windows-latest (Strawberry MinGW) | recursive DLL closure; import and formula smoke without Strawberry on PATH |
          | macOS x86_64+arm64 | Stata CPU | macos-14 | universal bundle, no OpenMP |
          EOF
          echo "---- release body ----"
          cat release_body.md

      - name: Upload assembled release snapshot
        uses: actions/upload-artifact@v4
        with:
          name: assembled-release-${{ github.ref_name }}
          path: |
            release_assets
            release_body.md
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Version tags alone may turn the already-validated assembly artifact into a
  # DRAFT release. Publication remains a separate H100-certified marker job.
  # ---------------------------------------------------------------------------
  release:
    name: Stage DRAFT GitHub Release
    needs: [assemble-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download assembled release snapshot
        uses: actions/download-artifact@v4
        with:
          name: assembled-release-${{ github.ref_name }}
          path: staged

      - name: Verify downloaded release snapshot
        run: |
          set -euo pipefail
          test -f staged/release_body.md
          test -f staged/release_assets/SHA256SUMS.txt
          ( cd staged/release_assets && sha256sum -c SHA256SUMS.txt )

      - name: Create DRAFT release with assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true                              # nothing public until a maintainer reviews + publishes
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: staged/release_body.md
          fail_on_unmatched_files: true
          files: |
            staged/release_assets/*.zip
            staged/release_assets/*.plugin
            staged/release_assets/*.whl
            staged/release_assets/*.tar.gz
            staged/release_assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in token; no extra secrets

      - name: Keep release draft pending exact H100 validation
        run: |
          set -euo pipefail
          echo "Draft assets are ready for external runtime certification."
          echo "Download plugins-linux from this workflow run and exercise the exact"
          echo "CUDA fatbins on the H100. Publish only by pushing"
          echo "publish-${{ github.ref_name }} at this same commit after that gate passes."

  # ---------------------------------------------------------------------------
  # Publication marker: this job never rebuilds or substitutes artifacts. It
  # publishes the pre-existing draft and the net-install snapshot only after a
  # maintainer has validated the exact CUDA bytes from the version-tag run on
  # real hardware and pushes publish-v<version> at the same commit.
  # ---------------------------------------------------------------------------
  publish-certified:
    name: Publish H100-certified draft and net-install site
    if: startsWith(github.ref, 'refs/tags/publish-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve and verify target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="${GITHUB_REF_NAME#publish-}"
          test -n "$TARGET"
          TAG_TYPE="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TARGET" \
            --jq '.object.type')"
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TARGET" \
            --jq '.object.sha')"
          if [ "$TAG_TYPE" = "tag" ]; then
            TARGET_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/$TAG_SHA" \
              --jq '.object.sha')"
          elif [ "$TAG_TYPE" = "commit" ]; then
            TARGET_SHA="$TAG_SHA"
          else
            echo "ERROR: unsupported target tag object type: $TAG_TYPE" >&2
            exit 1
          fi
          test "$TARGET_SHA" = "$GITHUB_SHA" || {
              echo "ERROR: publish marker and version tag do not resolve to the same commit." >&2
              exit 1
            }
          test "$(gh release view "$TARGET" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq .isDraft)" = "true" || {
              echo "ERROR: target release is absent or is no longer a draft." >&2
              exit 1
            }
          echo "TARGET_RELEASE=$TARGET" >> "$GITHUB_ENV"

      - name: Download exact net-install snapshot from draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p netinstall_site
          gh release download "$TARGET_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern xhdfe_xfe-stata-netinstall-site.zip
          unzip -q xhdfe_xfe-stata-netinstall-site.zip -d netinstall_site
          test -f netinstall_site/stata/xhdfe.pkg
          test -f netinstall_site/stata/xhdfegelbachbootstrap.ado

      - name: Publish certified Stata net-install site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./netinstall_site
          commit_message: Publish H100-certified Stata site for ${{ env.TARGET_RELEASE }}

      - name: Publish certified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$TARGET_RELEASE" \
            --draft=false \
            --latest \
            --repo "$GITHUB_REPOSITORY"
